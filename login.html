<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/logo/apple-touch-icon.png">
<title>登录 · 千年影戏</title>
<meta name="description" content="用邮箱登录千年影戏，收你的影箱与帖子。">
<link rel="stylesheet" href="assets/css/brush.css?v=11443">
<link rel="stylesheet" href="assets/css/token.css?v=11443">
<link rel="stylesheet" href="assets/css/layout.css?v=11443">
<link rel="stylesheet" href="assets/css/site.css?v=11443">
<link rel="stylesheet" href="assets/css/login.css?v=11699">
<link rel="stylesheet" href="assets/css/paper-bg.css?v=4">
<link rel="stylesheet" href="assets/css/readability.css?v=1">
</head>
<body class="inner login-page">

<header class="site-head">
  <div class="head-inner">
    <a class="brand" href="index.html">
      <span class="brand-seal"><img src="assets/img/logo/logo-128.png" alt="千年影戏" width="40" height="40"></span>
      <span class="brand-txt"><b>千年影戏</b><i>皮影数字馆</i></span>
    </a>
    <nav class="head-nav">
      <a href="index.html">首页</a>
      <a href="craft.html">影偶制作</a>
      <a href="community.html">戏影社区</a>
      <a href="vault.html">影藏</a>
      <a href="profile.html">个人中心</a>
    </nav>
    <div class="head-user">
      <a class="hu" href="profile.html">
        <span class="hu-av" data-user-av>影</span>
        <span class="hu-tx" data-user-name>登录</span>
      </a>
    </div>
  </div>
</header>

<main class="lg-main">
  <section class="lg-card">

    <p class="lg-kick">千年影戏 · 入班</p>
    <h1 class="lg-title" id="lgTitle">登录</h1>
    <p class="lg-sub" id="lgSub">用邮箱进你的影箱，收藏与帖子都记在这枚印下。</p>

    <div class="lg-tabs" role="tablist">
      <button type="button" class="lg-tab is-on" id="tabLogin" role="tab" aria-selected="true">登录</button>
      <button type="button" class="lg-tab" id="tabRegister" role="tab" aria-selected="false">注册</button>
    </div>

    <p class="lg-msg" id="lgMsg" role="alert" aria-live="polite"></p>

    <!-- ---------------- 登录 ---------------- -->
    <form class="lg-form" id="formLogin" novalidate>
      <div class="lg-field">
        <label for="lgEmail">邮箱</label>
        <input id="lgEmail" name="email" type="email" inputmode="email" autocomplete="username"
               placeholder="admin01@qiannianyingxi.test" maxlength="120" required>
      </div>

      <div class="lg-field">
        <label for="lgPwd">密码</label>
        <input id="lgPwd" name="password" type="password" autocomplete="current-password"
               placeholder="Qnyx2026#01" maxlength="64" required>
      </div>

      <div class="lg-field">
        <label for="lgCap">图形验证码</label>
        <div class="lg-caprow">
          <input id="lgCap" name="answer" type="text" inputmode="text" autocomplete="off"
                 placeholder="输入右侧字符" maxlength="6" required>
          <button type="button" class="lg-capbtn" id="lgCapBtn" title="看不清？换一张">
            <img id="lgCapImg" alt="图形验证码">
          </button>
        </div>
      </div>

      <button class="lg-submit" type="submit">登 录</button>
    </form>

    <!-- ---------------- 注册 ---------------- -->
    <form class="lg-form is-hidden" id="formRegister" novalidate>
      <div class="lg-field">
        <label for="rgEmail">邮箱</label>
        <input id="rgEmail" name="email" type="email" inputmode="email" autocomplete="email"
               placeholder="you@example.com" maxlength="120" required>
      </div>

      <div class="lg-field">
        <label for="rgCap">图形验证码</label>
        <div class="lg-caprow">
          <input id="rgCap" name="answer" type="text" autocomplete="off"
                 placeholder="输入右侧字符" maxlength="6" required>
          <button type="button" class="lg-capbtn" id="rgCapBtn" title="看不清？换一张">
            <img id="rgCapImg" alt="图形验证码">
          </button>
        </div>
      </div>

      <div class="lg-field">
        <label for="rgCode">邮箱验证码</label>
        <div class="lg-coderow">
          <input id="rgCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                 placeholder="六位数字" maxlength="6" required>
          <button type="button" class="lg-send" id="lgSend">发送</button>
        </div>
        <p class="lg-hint" id="lgHint">先填邮箱和图形验证码，再点「发送」。</p>
      </div>

      <div class="lg-field">
        <label for="rgPwd">设置密码</label>
        <input id="rgPwd" name="password" type="password" autocomplete="new-password"
               placeholder="至少 6 位" maxlength="64" required>
      </div>

      <button class="lg-submit" type="submit">注 册</button>
    </form>

    <p class="lg-foot">
      本站为演示站：账号只存在这台电脑的站点目录里，不对外发送任何数据。<br>
      不想登录？<a href="index.html">先随便逛逛</a>。
    </p>

  </section>
</main>

<script src="assets/js/login.js?v=11699"></script>
</body>
</html>
